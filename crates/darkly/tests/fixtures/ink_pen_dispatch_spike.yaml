# The Ink Pen with its terminal swapped for the dispatch-per-dab spike.
# A bench and test vehicle for docs/plans/compute-dispatch-per-dab-spike.md,
# not a shipped brush: same graph shape, same pressure wiring, same disc.
name: Ink Pen (dispatch spike)
description: Measurement vehicle. The Ink Pen graph terminating in the dispatch-per-dab spike terminal.
nodes:
  brush_settings:
    type: brush_settings
    inputs:
      stabilize: 0.6
  circle:
    type: circle
    inputs:
      softness: 0.1
  spike:
    type: paint_dispatch_spike
    inputs:
      softness: 0.1
  paint_color:
    type: paint_color
  pen_input:
    type: pen_input
  stamp:
    type: stamp
connections:
- circle.mask -> stamp.tip
- paint_color.color -> stamp.color
- paint_color.color -> spike.color
- pen_input.position -> spike.position
- pen_input.pressure -> spike.flow
- pen_input.pressure -> spike.size
- stamp.dab -> spike.rgba
exposed_ports:
  brush_settings.stabilize: {}
  brush_settings.size: {}
